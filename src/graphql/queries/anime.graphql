query GetAnimeList($year: Int, $season: Season, $pageNumber: Int, $pageSize: Int, $sortBy: SortBy) {
  animeList(
    year: $year
    season: $season
    pageNumber: $pageNumber
    pageSize: $pageSize
    sortBy: $sortBy
  ) {
    ...AnimeList
  }
}

query GetAnimeListBySearch($keyword: String, $pageNumber: Int, $pageSize: Int) {
  animeListBySearch(keyword: $keyword, pageNumber: $pageNumber, pageSize: $pageSize) {
    ...AnimeList
  }
}

fragment AnimeList on AnimePage {
  content {
    animeId
    ...AnimeCard
  }
  pageInfo {
    size
    number
    totalElements
    totalPages
  }
}

# 宫格和横向行共用同一份数据，切换样式时不需要重新请求
fragment AnimeCard on Anime {
  animeId
  title {
    titleNative
    titleCn
  }
  coverImage
  averageScore
  popularity
  startDate
}

query GetAnimeDetail($animeId: ID!) {
  anime(animeId: $animeId) {
    animeId
    coverImage
    startDate
    averageScore
    popularity
    title {
      titleNative
      titleRomaji
      titleEn
      titleCn
    }
    mappings {
      mappingId
      ...MappingItem
    }
  }
}

fragment MappingItem on Mapping {
  sourcePlatform
  platformId
  rawScore
  normalizedScore
  rawPopularity
  normalizedPopularity
}
